<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyclops — execution trace</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      html,
      body,
      header,
      header *,
      #root,
      .cyc-card,
      .cyc-card *,
      .cyc-replay,
      .cyc-replay * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        color: #1e293b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
      }
      header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 9px 16px;
        border-bottom: 1px solid #e2e8f0;
        background: #f8fafc;
      }
      header h1 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #0f172a;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 11.5px;
        color: #64748b;
        flex-wrap: wrap;
      }
      .lg {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .sw {
        display: inline-block;
        width: 20px;
        height: 0;
        border-top: 2px solid #94a3b8;
      }
      .sw-ret {
        border-top: 2px dashed #0d9488;
      }
      .sw-val {
        width: auto;
        height: 15px;
        border: 1px solid #99f6e4;
        border-radius: 999px;
        background: #f0fdfa;
        color: #0f766e;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 9.5px;
        line-height: 13px;
        padding: 0 6px;
      }
      .sw-err {
        width: 9px;
        height: 9px;
        border: 0;
        border-radius: 50%;
        background: #dc2626;
      }
      .sw-root {
        width: 15px;
        height: 11px;
        border: 0;
        border-radius: 3px;
        background: #0f172a;
      }
      .sw-sel {
        width: 15px;
        height: 11px;
        border: 1.5px solid #2563eb;
        border-radius: 3px;
        background: #fff;
        box-shadow: 0 0 0 2px rgb(37 99 235 / 0.22);
      }
      #root {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
      }
      #flowwrap {
        height: 100%;
      }

      /* ---------- function nodes ---------- */
      #root .react-flow__node {
        box-sizing: border-box;
        background: #ffffff;
        border: 1.5px solid #cbd5e1;
        border-radius: 8px;
        padding: 6px 9px 7px;
        font-size: 13px;
        color: #0f172a;
        text-align: left;
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
        cursor: grab;
        transition: border-color 0.15s ease, box-shadow 0.15s ease,
          opacity 0.2s ease;
      }
      #root .react-flow__node:active {
        cursor: grabbing;
      }
      #root .cyc-head {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      #root .cyc-fn {
        flex: 1 1 auto;
        min-width: 0;
        font-weight: 650;
        font-size: 12.5px;
        letter-spacing: -0.01em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #root .cyc-tag {
        flex: 0 0 auto;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        background: #0f172a;
        color: #ffffff;
        border-radius: 4px;
        padding: 1.5px 4px;
      }
      #root .cyc-flag {
        flex: 0 0 auto;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #dc2626;
        color: #fff;
        font-size: 9px;
        font-weight: 800;
        line-height: 13px;
        text-align: center;
      }
      #root .cyc-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        min-width: 0;
        margin-top: 1px;
        font-size: 9.5px;
        line-height: 1.3;
        letter-spacing: 0.02em;
        color: #94a3b8;
        font-variant-numeric: tabular-nums;
      }
      #root .cyc-meta-v {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #root .cyc-hid {
        flex: 0 0 auto;
        padding: 0 4px;
        border: 1px solid #c7d2fe;
        background: #eef2ff;
        color: #4338ca;
        border-radius: 3px;
        font-size: 9px;
        font-weight: 700;
        line-height: 14px;
      }
      #root .cyc-meta-r {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 0 0 auto;
      }
      #root .cyc-time {
        flex: 0 0 auto;
        padding: 0 4px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #64748b;
        border-radius: 3px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 9px;
        line-height: 14px;
        white-space: nowrap;
      }
      #root .cyc-out {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        margin-top: 5px;
        padding-top: 4px;
        border-top: 1px solid #f1f5f9;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        line-height: 1.35;
        color: #0f766e;
      }
      #root .cyc-out-k {
        flex: 0 0 auto;
        opacity: 0.7;
      }
      #root .cyc-out-v {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #115e59;
      }
      #root .cyc-out.cyc-out-err {
        color: #b91c1c;
        border-top-color: #fee2e2;
      }
      #root .cyc-out.cyc-out-err .cyc-out-v {
        color: #b91c1c;
      }

      /* ---------- node states ---------- */
      #root .react-flow__node.cyc-dim {
        opacity: 0.28;
        filter: grayscale(0.7);
      }
      #root .react-flow__node.cyc-sub {
        border-color: #bfdbfe;
        background: #f8fbff;
      }
      #root .react-flow__node.cyc-path {
        border-color: #93c5fd;
        box-shadow: inset 3px 0 0 #2563eb, 0 1px 2px rgb(15 23 42 / 0.06);
      }
      #root .react-flow__node.cyc-active {
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgb(245 158 11 / 0.32);
        animation: cyc-pulse 1.2s ease-in-out infinite;
      }
      @keyframes cyc-pulse {
        50% {
          box-shadow: 0 0 0 6px rgb(245 158 11 / 0.14);
        }
      }
      #root .react-flow__node.cyc-sel {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgb(37 99 235 / 0.28),
          0 8px 18px rgb(37 99 235 / 0.16);
      }
      #root .react-flow__node.cyc-err {
        background: #fff5f5;
        border-color: #fca5a5;
        color: #7f1d1d;
      }
      #root .react-flow__node.cyc-err.cyc-sel {
        border-color: #dc2626;
        box-shadow: 0 0 0 3px rgb(220 38 38 / 0.25),
          0 8px 18px rgb(220 38 38 / 0.14);
      }
      #root .react-flow__node.cyc-root {
        background: #0f172a;
        border-color: #0f172a;
        color: #e2e8f0;
        box-shadow: 0 6px 18px rgb(15 23 42 / 0.28);
      }
      #root .react-flow__node.cyc-root .cyc-tag {
        background: #38bdf8;
        color: #082f49;
      }
      #root .react-flow__node.cyc-root .cyc-out {
        border-top-color: rgb(255 255 255 / 0.14);
        color: #5eead4;
      }
      #root .react-flow__node.cyc-root .cyc-out-v {
        color: #99f6e4;
      }
      #root .react-flow__node.cyc-root.cyc-sel,
      #root .react-flow__node.cyc-root.cyc-active {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgb(37 99 235 / 0.35),
          0 8px 20px rgb(37 99 235 / 0.25);
      }
      #root .react-flow__node.cyc-root.cyc-active {
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgb(245 158 11 / 0.35),
          0 8px 20px rgb(245 158 11 / 0.2);
      }
      #root .react-flow__handle {
        width: 7px;
        height: 7px;
        background: #94a3b8;
        border: 1.5px solid #ffffff;
        opacity: 0.55;
      }

      /* ---------- edges: solid = call, dashed teal = return ---------- */
      #root .react-flow__edge .react-flow__edge-path {
        stroke: #94a3b8;
        stroke-width: 1.6;
        fill: none;
      }
      #root .react-flow__edge.cyc-e-path .react-flow__edge-path {
        stroke: #2563eb;
        stroke-width: 2.6;
      }
      #root .react-flow__edge.cyc-e-sub .react-flow__edge-path {
        stroke: #60a5fa;
        stroke-width: 2;
      }
      #root .react-flow__edge.cyc-e-dim {
        opacity: 0.12;
      }
      #root .react-flow__edge.cyc-e-ret .react-flow__edge-path {
        stroke: #0d9488;
        stroke-width: 1.7;
        stroke-dasharray: 6 5;
      }
      #root .react-flow__edge {
        animation: cyc-in 0.3s ease-out backwards;
      }
      @keyframes cyc-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root .react-flow__edge,
        #root .react-flow__node.cyc-active {
          animation: none;
        }
      }

      /* ---------- edge value labels ---------- */
      .cyc-lab {
        position: absolute;
        max-width: 132px;
        padding: 1.5px 6px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.08);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 9.5px;
        line-height: 1.4;
        color: #64748b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      .cyc-lab-args {
        background: #f8fbff;
        border-color: #bfdbfe;
        color: #1d4ed8;
      }
      .cyc-lab-ret {
        background: #f0fdfa;
        border-color: #99f6e4;
        color: #0f7668;
      }
      .cyc-lab-err {
        background: #fef2f2;
        border-color: #fecaca;
        color: #b91c1c;
      }

      /* ---------- replay bar ---------- */
      #root .cyc-replay {
        position: absolute;
        left: 56px;
        bottom: 14px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgb(15 23 42 / 0.12);
        font-size: 12px;
        color: #334155;
      }
      #root .cyc-replay button,
      #root .cyc-replay select {
        font: inherit;
        color: #1e293b;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      #root .cyc-replay button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #root .cyc-replay label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: #475569;
      }
      #root .cyc-count {
        font-variant-numeric: tabular-nums;
        color: #64748b;
      }
      #root .cyc-stats {
        color: #94a3b8;
        border-left: 1px solid #e2e8f0;
        padding-left: 8px;
        max-width: 340px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ---------- inspection card ---------- */
      .cyc-card {
        min-width: 268px;
        max-width: 360px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgb(15 23 42 / 0.12);
        padding: 10px 12px 12px;
        font-size: 13px;
        color: #1e293b;
      }
      .cyc-card-top {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .cyc-name {
        flex: 1 1 auto;
        min-width: 0;
        font-weight: 700;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .cyc-where {
        flex: 0 0 auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        color: #94a3b8;
      }
      .cyc-x {
        flex: 0 0 auto;
        border: 0;
        background: none;
        color: #94a3b8;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
        padding: 0 2px;
      }
      .cyc-x:hover {
        color: #334155;
      }
      .cyc-crumb {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 3px;
        margin-top: 6px;
        font-size: 11px;
      }
      .cyc-bc {
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #475569;
        border-radius: 5px;
        padding: 1px 5px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        max-width: 130px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cyc-bc:hover {
        background: #eef2f7;
      }
      .cyc-bc-here {
        background: #eff6ff;
        border-color: #bfdbfe;
        color: #1d4ed8;
        font-weight: 650;
        cursor: default;
      }
      .cyc-sep {
        color: #cbd5e1;
      }
      .cyc-sec {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #94a3b8;
        margin: 10px 0 1px;
      }
      .cyc-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 12px;
        line-height: 1.5;
        border-top: 1px solid #f1f5f9;
        padding: 4px 0;
      }
      .cyc-k {
        color: #64748b;
        min-width: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .cyc-v {
        flex: 1;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #0f172a;
      }
      .cyc-type {
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 600;
        color: #0369a1;
        background: #e0f2fe;
        border-radius: 99px;
        padding: 1px 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .cyc-row.cyc-err .cyc-v {
        color: #b91c1c;
      }
      .cyc-row.cyc-err .cyc-type {
        color: #b91c1c;
        background: #fee2e2;
      }
      .cyc-empty {
        color: #94a3b8;
        font-style: italic;
        border-top: 0;
      }
      .cyc-kids {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        padding-top: 5px;
        border-top: 1px solid #f1f5f9;
      }
      .cyc-kid {
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #334155;
        border-radius: 6px;
        padding: 2px 7px;
        font: inherit;
        font-size: 11.5px;
        cursor: pointer;
      }
      .cyc-kid:hover {
        background: #eff6ff;
        border-color: #bfdbfe;
        color: #1d4ed8;
      }
      .cyc-card-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .cyc-card-actions button {
        font-size: 12px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #334155;
        border-radius: 6px;
        padding: 3px 10px;
        cursor: pointer;
      }
      .cyc-card-actions button:hover:not(:disabled) {
        background: #e2e8f0;
      }
      .cyc-card-actions button:disabled {
        opacity: 0.45;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Cyclops</h1>
      <div class="legend" aria-hidden="true">
        <span class="lg"><i class="sw"></i>call</span>
        <span class="lg"><i class="sw sw-ret"></i>return</span>
        <span class="lg"><i class="sw sw-val">↩ 6</i>returned value</span>
        <span class="lg"><i class="sw sw-root"></i>root</span>
        <span class="lg"><i class="sw sw-sel"></i>selected</span>
        <span class="lg"><i class="sw sw-err"></i>error</span>
      </div>
    </header>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
