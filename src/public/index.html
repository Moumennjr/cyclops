<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cyclops — call tree</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 12px 20px;
      border-bottom: 1px solid #1e293b;
    }
    header h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; }
    #stats { color: #94a3b8; font-size: 13px; }
    #status { margin-left: auto; font-size: 12px; color: #64748b; }
    #controls { margin-left: 12px; display: flex; gap: 6px; }
    #controls button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 6px;
      padding: 2px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    #controls button:hover { background: #334155; }
    #treewrap { padding: 24px; overflow: auto; height: calc(100vh - 53px); }
    #tree { min-width: 300px; min-height: 300px; display: inline-block; }
    #tree svg { max-width: none; }
    #empty { color: #94a3b8; text-align: center; padding: 80px 24px; line-height: 1.8; }
    #empty code {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 5px;
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cyclops</h1>
    <span id="stats">waiting…</span>
    <span id="status">connecting…</span>
    <span id="controls">
      <button id="zout">−</button>
      <button id="zreset">•</button>
      <button id="zin">+</button>
    </span>
  </header>
  <div id="treewrap"><div id="tree"></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
