<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyclops — call tree</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.12.0/dist/style.css"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #ffffff;
        color: #1e293b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid #e2e8f0;
        background: #f8fafc;
      }
      header h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.02em;
      }
      #stats {
        color: #64748b;
        font-size: 13px;
      }
      #status {
        margin-left: auto;
        font-size: 12px;
        color: #475569;
      }
      #root .react-flow__node {
        background: #ffffff;
        border: 1.5px solid #cbd5e1;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 13px;
        color: #1e293b;
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
      }
      #root .react-flow__node.cyc-err {
        background: #fef2f2;
        border-color: #dc2626;
        color: #7f1d1d;
      }
      #root .react-flow__node.selected {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgb(37 99 235 / 0.35);
      }
      #root .react-flow__handle {
        background: #94a3b8;
      }
      #root .cyc-replay {
        position: absolute;
        left: 14px;
        bottom: 14px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgb(15 23 42 / 0.12);
        font-size: 12px;
        color: #334155;
      }
      #root .cyc-replay button,
      #root .cyc-replay select {
        font: inherit;
        color: #1e293b;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      #root .cyc-replay button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #root .cyc-replay label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: #475569;
      }
      #root .cyc-count {
        font-variant-numeric: tabular-nums;
        color: #64748b;
      }
      #root .cyc-stats {
        color: #94a3b8;
        border-left: 1px solid #e2e8f0;
        padding-left: 8px;
        max-width: 340px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #root .react-flow__node,
      #root .react-flow__edge {
        animation: cyc-in 0.35s ease-out backwards;
      }
      @keyframes cyc-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      #root .react-flow__node.active {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgb(37 99 235 / 0.3);
        animation: cyc-pulse 1.1s ease-in-out infinite;
      }
      @keyframes cyc-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 3px rgb(37 99 235 / 0.3);
        }
        50% {
          box-shadow: 0 0 0 7px rgb(37 99 235 / 0.08);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root .react-flow__node,
        #root .react-flow__edge {
          animation: none;
        }
        #root .react-flow__node.active {
          animation: none;
        }
      }
      #detail {
        position: absolute;
        right: 14px;
        top: 14px;
        z-index: 20;
        min-width: 240px;
        max-width: 340px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgb(15 23 42 / 0.12);
        padding: 12px 14px;
        display: none;
      }
      #detail.open {
        display: block;
      }
      #detail .cyc-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 8px;
      }
      #detail .cyc-sub {
        font-size: 11px;
        font-weight: 500;
        color: #64748b;
        border: 1px solid #cbd5e1;
        border-radius: 99px;
        padding: 1px 8px;
      }
      #detail .cyc-row {
        display: flex;
        gap: 8px;
        font-size: 12px;
        line-height: 1.5;
        border-top: 1px solid #f1f5f9;
        padding: 4px 0;
      }
      #detail .cyc-k {
        color: #64748b;
        min-width: 56px;
      }
      #detail .cyc-err .cyc-v {
        color: #b91c1c;
      }
      #detail .cyc-btns {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      #detail button {
        font-size: 12px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #334155;
        border-radius: 6px;
        padding: 3px 10px;
        cursor: pointer;
      }
      #detail button:hover {
        background: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Cyclops</h1>
    </header>
    <div id="root"></div>
    <div id="detail"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
